<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Church outline -->
  <rect x="50" y="50" width="700" height="500" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  
  <!-- Nave -->
  <rect x="100" y="100" width="600" height="400" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
  
  <!-- Altar area -->
  <rect x="600" y="100" width="100" height="400" fill="#d0d0d0" stroke="#666" stroke-width="1"/>
  
  <!-- West Window (entrance end) -->
  <rect x="50" y="100" width="30" height="80" fill="#4a90e2" stroke="#2a5a9a" stroke-width="2" opacity="0.7"/>
  <text x="65" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#2a5a9a" font-weight="bold">West</text>
  
  <!-- Labels -->
  <text x="400" y="40" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">All Saints Church Floor Plan</text>
  <text x="100" y="530" font-family="Arial" font-size="12" fill="#666">West Entrance</text>
  <text x="650" y="530" font-family="Arial" font-size="12" fill="#666">Altar</text>
</svg>

